services:
  - type: web
    name: rajasthani-wedding-invitation
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PHOTOGRAPHER_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
